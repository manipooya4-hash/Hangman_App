name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip python3-venv git zip unzip \
            build-essential libffi-dev libssl-dev zlib1g-dev \
            autoconf automake libtool pkg-config cmake

      - name: Set up Python and Buildozer
        run: |
          python3 -m venv venv
          venv/bin/python -m pip install --upgrade pip setuptools wheel
          venv/bin/python -m pip install --no-user buildozer cython==0.29.36
          echo "$PWD/venv/bin" >> $GITHUB_PATH

      - name: Build APK
        run: |
          venv/bin/buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hangman-APK
          path: bin/*.apk
